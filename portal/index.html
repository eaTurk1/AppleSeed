<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AppleSeed</title><link rel="stylesheet" href="./portal.css"><script type="module" src="./pair.js"></script></head>
<body class="pair"><main><img src="./icon.png" width="88" height="88" alt="AppleSeed"><h1>Your Mac is waiting.</h1><p>Enter the code shown in AppleSeed on your phone.</p><form id="pair"><label for="code">Session code</label><input id="code" name="code" minlength="8" maxlength="9" autocomplete="off" autocapitalize="characters" spellcheck="false" required placeholder="ABCD 2345"><button id="enter">Connect</button></form><p id="message" role="status">One code. One browser. Up to two screens.</p></main></body></html>
